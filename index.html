<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <title>Dia de las Flores Amarillas 🌻</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:Georgia,serif;touch-action:none;}

    #entrada{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 55%,#200a00 0%,#0d0400 50%,#000 100%);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      z-index:20;transition:opacity 1.5s ease,transform 1.5s ease;}
    #entrada.ocultar{opacity:0;transform:scale(1.3);pointer-events:none;}

    #ep{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
    .ep-dot{position:absolute;border-radius:50%;background:radial-gradient(circle,#ffdd00,transparent);
      animation:epf var(--d) ease-in-out infinite alternate;opacity:var(--o);}
    @keyframes epf{from{transform:translate(0,0) scale(1);}to{transform:translate(var(--tx),var(--ty)) scale(var(--s));}}

    .rings{position:relative;display:flex;align-items:center;justify-content:center;width:240px;height:240px;}
    .ring{position:absolute;border-radius:50%;border:2px solid rgba(255,200,0,.5);animation:ring 2.8s ease-out infinite;}
    .ring:nth-child(1){width:140px;height:140px;animation-delay:0s;}
    .ring:nth-child(2){width:185px;height:185px;animation-delay:.8s;}
    .ring:nth-child(3){width:230px;height:230px;animation-delay:1.6s;}
    @keyframes ring{0%{transform:scale(.4);opacity:.9;}100%{transform:scale(1.1);opacity:0;}}

    #florBtn{position:relative;z-index:2;cursor:pointer;animation:idle 3.5s ease-in-out infinite;
      filter:drop-shadow(0 0 22px #ffaa00) drop-shadow(0 0 50px #ff5500);
      -webkit-filter:drop-shadow(0 0 22px #ffaa00) drop-shadow(0 0 50px #ff5500);transition:transform .15s;}
    #florBtn:active{transform:scale(.88)!important;}
    @keyframes idle{0%,100%{transform:scale(1) rotate(0deg);}33%{transform:scale(1.1) rotate(8deg);}66%{transform:scale(1.06) rotate(-6deg);}}

    .hint{margin-top:26px;color:#ffd54f;font-size:1.05rem;letter-spacing:3px;text-transform:uppercase;
      text-shadow:0 0 12px #ffaa00;animation:blink 2s ease-in-out infinite;}
    @keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}
    .sub-entrada{margin-top:12px;color:rgba(255,245,200,.5);font-size:.8rem;letter-spacing:5px;
      text-transform:uppercase;text-align:center;padding:0 30px;}

    #cvs{position:fixed;inset:0;display:block;opacity:0;transition:opacity 2s ease .2s;}
    #cvs.vis{opacity:1;}

    #ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
      padding-top:clamp(18px,5vw,40px);pointer-events:none;z-index:10;
      opacity:0;transition:opacity 2s ease .9s;}
    #ui.vis{opacity:1;}

    .ttl{font-size:clamp(1.5rem,5.5vw,3rem);font-weight:bold;text-transform:uppercase;
      letter-spacing:3px;text-align:center;line-height:1.2;
      background:linear-gradient(90deg,#ffee00,#ffcc00,#ff9900,#ffee00);
      background-size:300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
      background-clip:text;animation:gradmove 3s linear infinite;
      filter:drop-shadow(0 0 10px #ffcc00);-webkit-filter:drop-shadow(0 0 10px #ffcc00);}
    @keyframes gradmove{0%{background-position:0%}100%{background-position:300%}}
    .sub{margin-top:10px;color:rgba(255,245,200,.6);font-size:clamp(.75rem,2vw,.95rem);
      letter-spacing:6px;text-transform:uppercase;text-align:center;}

    #controles{position:fixed;bottom:clamp(14px,4vw,26px);left:50%;transform:translateX(-50%);
      z-index:15;display:flex;gap:12px;align-items:center;
      opacity:0;transition:opacity 2s ease 1.4s;pointer-events:all;}
    #controles.vis{opacity:1;}

    .cbtn{background:rgba(255,200,0,.1);border:1px solid rgba(255,200,0,.4);
      color:#ffd54f;padding:9px 22px;border-radius:40px;font-size:.82rem;
      letter-spacing:2px;text-transform:uppercase;cursor:pointer;
      backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
      transition:background .25s,transform .1s;}
    .cbtn:active{background:rgba(255,200,0,.3);transform:scale(.95);}

    #vizCanvas{position:fixed;bottom:0;left:0;width:100%;height:60px;z-index:9;
      opacity:0;transition:opacity 1.5s ease 1.2s;pointer-events:none;}
    #vizCanvas.vis{opacity:1;}

    /* ── TARJETAS ── */
    #overlay-tarjeta{position:fixed;inset:0;z-index:40;
      display:flex;align-items:center;justify-content:center;
      background:rgba(0,0,0,.6);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
      opacity:0;pointer-events:none;transition:opacity .5s ease;}
    #overlay-tarjeta.vis{opacity:1;pointer-events:all;}

    .tarjeta-modal{background:linear-gradient(160deg,#1c0800 0%,#2e1200 60%,#1a0600 100%);
      border:1px solid rgba(255,185,0,.35);border-radius:22px;padding:0 0 28px 0;
      width:min(88vw,380px);overflow:hidden;text-align:center;
      box-shadow:0 0 40px rgba(255,150,0,.25),inset 0 0 30px rgba(255,120,0,.06);
      transform:scale(.82) translateY(40px);
      transition:transform .5s cubic-bezier(.34,1.56,.64,1);}
    #overlay-tarjeta.vis .tarjeta-modal{transform:scale(1) translateY(0);}

    .tarjeta-imagen{width:100%;height:200px;display:flex;align-items:center;justify-content:center;
      background:radial-gradient(ellipse at 50% 80%,#3d1800 0%,#1a0800 70%,#000 100%);
      position:relative;overflow:hidden;}
    .tarjeta-imagen svg{filter:drop-shadow(0 8px 18px rgba(180,90,0,.6));}
    .tarjeta-imagen::after{content:'';position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);
      width:160px;height:60px;border-radius:50%;background:rgba(255,160,0,.18);filter:blur(18px);}

    .tarjeta-titulo{margin:18px 24px 10px;font-size:1.5rem;color:#ffe680;
      font-style:italic;text-shadow:0 0 12px rgba(255,200,0,.5);}
    .tarjeta-msg{margin:0 26px 20px;color:rgba(255,235,180,.82);font-size:.92rem;line-height:1.8;}
    .tarjeta-cerrar{display:inline-block;border:1px solid rgba(255,200,0,.45);
      color:#ffd54f;background:rgba(255,200,0,.08);padding:9px 38px;border-radius:40px;
      font-size:.88rem;letter-spacing:2px;cursor:pointer;transition:background .25s;}
    .tarjeta-cerrar:active{background:rgba(255,200,0,.25);}

    /* ── NOTA MUSICA ── */
    #notaMusica{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
      z-index:50;background:rgba(0,0,0,.82);border:1px solid rgba(255,200,0,.5);
      color:#ffd54f;padding:20px 30px;border-radius:16px;font-size:1rem;
      letter-spacing:1px;text-align:center;line-height:1.8;
      backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;}
    #notaMusica button{margin-top:14px;background:rgba(255,200,0,.2);
      border:1px solid rgba(255,200,0,.6);color:#ffd54f;padding:9px 26px;
      border-radius:30px;font-size:.95rem;cursor:pointer;letter-spacing:2px;}
  </style>
</head>
<body>

<!-- ENTRADA -->
<div id="entrada">
  <div id="ep"></div>
  <div class="rings">
    <div class="ring"></div><div class="ring"></div><div class="ring"></div>
    <svg id="florBtn" width="130" height="130" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="button" aria-label="Abrir galaxia">
      <defs>
        <radialGradient id="gP" cx="50%" cy="18%" r="82%">
          <stop offset="0%" stop-color="#FFF0A0"/><stop offset="40%" stop-color="#FFD000"/><stop offset="100%" stop-color="#E06000"/>
        </radialGradient>
        <radialGradient id="gC" cx="40%" cy="35%" r="60%">
          <stop offset="0%" stop-color="#A0571A"/><stop offset="55%" stop-color="#5D2E00"/><stop offset="100%" stop-color="#2A0E00"/>
        </radialGradient>
        <radialGradient id="gBr" cx="38%" cy="32%" r="55%">
          <stop offset="0%" stop-color="rgba(255,240,140,.5)"/><stop offset="100%" stop-color="rgba(255,200,0,0)"/>
        </radialGradient>
        <filter id="fw" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="2.8" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g transform="translate(100,100)">
        <ellipse cx="0" cy="-53" rx="16" ry="34" fill="#C06000" opacity=".35" transform="rotate(22.5) translate(1,3)"/>
        <ellipse cx="0" cy="-53" rx="16" ry="34" fill="#C06000" opacity=".35" transform="rotate(67.5) translate(1,3)"/>
        <ellipse cx="0" cy="-53" rx="16" ry="34" fill="#C06000" opacity=".35" transform="rotate(112.5) translate(1,3)"/>
        <ellipse cx="0" cy="-53" rx="16" ry="34" fill="#C06000" opacity=".35" transform="rotate(157.5) translate(1,3)"/>
        <ellipse cx="0" cy="-53" rx="16" ry="34" fill="#C06000" opacity=".35" transform="rotate(202.5) translate(1,3)"/>
        <ellipse cx="0" cy="-53" rx="16" ry="34" fill="#C06000" opacity=".35" transform="rotate(247.5) translate(1,3)"/>
        <ellipse cx="0" cy="-53" rx="16" ry="34" fill="#C06000" opacity=".35" transform="rotate(292.5) translate(1,3)"/>
        <ellipse cx="0" cy="-53" rx="16" ry="34" fill="#C06000" opacity=".35" transform="rotate(337.5) translate(1,3)"/>
      </g>
      <g transform="translate(100,100)" filter="url(#fw)">
        <ellipse cx="0" cy="-53" rx="16" ry="34" fill="url(#gP)" opacity=".7" transform="rotate(0)"/>
        <ellipse cx="0" cy="-53" rx="16" ry="34" fill="url(#gP)" opacity=".7" transform="rotate(45)"/>
        <ellipse cx="0" cy="-53" rx="16" ry="34" fill="url(#gP)" opacity=".7" transform="rotate(90)"/>
        <ellipse cx="0" cy="-53" rx="16" ry="34" fill="url(#gP)" opacity=".7" transform="rotate(135)"/>
        <ellipse cx="0" cy="-53" rx="16" ry="34" fill="url(#gP)" opacity=".7" transform="rotate(180)"/>
        <ellipse cx="0" cy="-53" rx="16" ry="34" fill="url(#gP)" opacity=".7" transform="rotate(225)"/>
        <ellipse cx="0" cy="-53" rx="16" ry="34" fill="url(#gP)" opacity=".7" transform="rotate(270)"/>
        <ellipse cx="0" cy="-53" rx="16" ry="34" fill="url(#gP)" opacity=".7" transform="rotate(315)"/>
      </g>
      <g transform="translate(100,100)" filter="url(#fw)">
        <ellipse cx="0" cy="-58" rx="14.5" ry="37" fill="url(#gP)" transform="rotate(22.5)"/>
        <ellipse cx="0" cy="-58" rx="14.5" ry="37" fill="url(#gP)" transform="rotate(67.5)"/>
        <ellipse cx="0" cy="-58" rx="14.5" ry="37" fill="url(#gP)" transform="rotate(112.5)"/>
        <ellipse cx="0" cy="-58" rx="14.5" ry="37" fill="url(#gP)" transform="rotate(157.5)"/>
        <ellipse cx="0" cy="-58" rx="14.5" ry="37" fill="url(#gP)" transform="rotate(202.5)"/>
        <ellipse cx="0" cy="-58" rx="14.5" ry="37" fill="url(#gP)" transform="rotate(247.5)"/>
        <ellipse cx="0" cy="-58" rx="14.5" ry="37" fill="url(#gP)" transform="rotate(292.5)"/>
        <ellipse cx="0" cy="-58" rx="14.5" ry="37" fill="url(#gP)" transform="rotate(337.5)"/>
      </g>
      <circle cx="100" cy="100" r="26" fill="url(#gC)" filter="url(#fw)"/>
      <circle cx="100" cy="100" r="20" fill="none" stroke="#8B4A00" stroke-width="1.5" stroke-dasharray="3 2" opacity=".8"/>
      <g fill="#3a1200" opacity=".55" transform="translate(100,100)">
        <circle cx="0" cy="-12" r="1.8"/><circle cx="8" cy="-9" r="1.4"/>
        <circle cx="12" cy="0" r="1.8"/><circle cx="8" cy="9" r="1.4"/>
        <circle cx="0" cy="12" r="1.8"/><circle cx="-8" cy="9" r="1.4"/>
        <circle cx="-12" cy="0" r="1.8"/><circle cx="-8" cy="-9" r="1.4"/>
        <circle cx="0" cy="0" r="2.2"/>
      </g>
      <circle cx="100" cy="100" r="26" fill="url(#gBr)"/>
    </svg>
  </div>
  <p class="hint">&#10024; Toca la flor &#10024;</p>
  <p class="sub-entrada">Dia de las Flores Amarillas</p>
</div>

<!-- TARJETAS POETICAS -->
<div id="overlay-tarjeta">
  <div class="tarjeta-modal">
    <div class="tarjeta-imagen" id="tarjeta-svg-wrap"></div>
    <p class="tarjeta-titulo" id="tarjeta-titulo"></p>
    <p class="tarjeta-msg" id="tarjeta-msg"></p>
    <button class="tarjeta-cerrar" id="tarjeta-cerrar">Cerrar</button>
  </div>
</div>

<!-- AUDIO -->
<audio id="audioFlor" loop preload="auto">
  <source src="musica.mp3" type="audio/mpeg"/>
</audio>

<!-- CANVAS -->
<canvas id="cvs"></canvas>
<canvas id="vizCanvas"></canvas>

<!-- NOTA MUSICA MOVIL -->
<div id="notaMusica">
  &#127803; Activar la musica de Floricienta?<br>
  <button id="btnActivarMusica">&#127925; Activar!</button>
</div>

<!-- UI -->
<div id="ui">
  <h1 class="ttl">Dia de las<br>Flores Amarillas</h1>
  <p class="sub">&#10022; &nbsp;21 de Septiembre&nbsp; &#10022;</p>
</div>

<div id="controles">
  <button class="cbtn" id="btnMusica">&#127925; Musica</button>
  <button class="cbtn" id="btnVolver">&#8592; Volver</button>
</div>

<script>
'use strict';
var PI2=Math.PI*2;
function rnd(a,b){return Math.random()*(b-a)+a;}

// CANVAS
var cvs=document.getElementById('cvs');
var ctx=cvs.getContext('2d');
var W,H,CX,CY;
function resize(){W=window.innerWidth;H=window.innerHeight;CX=W/2;CY=H/2;cvs.width=W;cvs.height=H;}
resize();
window.addEventListener('resize',function(){resize();init();});

var t=0,angRot=0,activa=false;

// PARTICULAS ENTRADA
var epEl=document.getElementById('ep');
for(var i=0;i<55;i++){
  var d=document.createElement('div');d.className='ep-dot';
  var s=rnd(1,4);
  d.style.cssText='width:'+s+'px;height:'+s+'px;left:'+rnd(0,100)+'%;top:'+rnd(0,100)+'%;--d:'+rnd(3,7).toFixed(1)+'s;--o:'+rnd(.05,.35).toFixed(2)+';--tx:'+rnd(-25,25).toFixed(0)+'px;--ty:'+rnd(-25,25).toFixed(0)+'px;--s:'+rnd(.5,1.8).toFixed(2)+';animation-delay:'+rnd(0,5).toFixed(1)+'s;';
  epEl.appendChild(d);
}

// PROYECCION 3D
var INCL=0.48;
function proyectar(x0,y0,z0,ar){
  var xr=x0*Math.cos(ar)+z0*Math.sin(ar);
  var zr=-x0*Math.sin(ar)+z0*Math.cos(ar);
  var yr=y0*Math.cos(INCL)-zr*Math.sin(INCL);
  var zf=y0*Math.sin(INCL)+zr*Math.cos(INCL);
  var fov=580,dist=fov+zf*0.3;
  return{sx:CX+(xr*fov)/dist,sy:CY+(yr*fov)/dist,sf:fov/dist};
}
function radioMax(){return Math.min(W,H)*0.44;}

// FONDO ESTELAR
var FONDO=[];
function crearFondo(){FONDO=[];for(var i=0;i<240;i++)FONDO.push({x:rnd(0,1),y:rnd(0,1),r:rnd(.3,1.8),br:rnd(.2,1),vel:rnd(.3,1.4),fase:rnd(0,PI2)});}
function dibujarFondo(){for(var i=0;i<FONDO.length;i++){var s=FONDO[i];ctx.globalAlpha=s.br*(.4+.6*Math.sin(t*s.vel+s.fase));ctx.fillStyle='#fff9e0';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,PI2);ctx.fill();}ctx.globalAlpha=1;}

// GALAXIA ESPIRAL
var PART=[];
function construirGalaxia(){
  PART=[];var RM=radioMax();var BRAZOS=3;var POR_BRAZO=650;
  for(var b=0;b<BRAZOS;b++){var off=(b/BRAZOS)*PI2;for(var i=0;i<POR_BRAZO;i++){var frac=i/POR_BRAZO;var r=5+frac*RM;var ang=frac*Math.PI*5+off;PART.push({x0:Math.cos(ang)*r+rnd(-1,1)*r*.20,y0:rnd(-1,1)*(1-frac)*RM*.07,z0:Math.sin(ang)*r+rnd(-1,1)*r*.20,r:(1-frac)*2.6+rnd(.15,1.1),h:rnd(28,54),s:rnd(72,100),l:rnd(55,92),a:rnd(.35,.9)});}}
  for(var i=0;i<350;i++){var r=rnd(0,RM),ang=rnd(0,PI2);PART.push({x0:Math.cos(ang)*r,y0:rnd(-1,1)*RM*.05,z0:Math.sin(ang)*r,r:rnd(.2,.9),h:rnd(32,58),s:rnd(55,85),l:rnd(58,82),a:rnd(.1,.35)});}
}
function dibujarGalaxia(ar){for(var i=0;i<PART.length;i++){var p=PART[i];var proj=proyectar(p.x0,p.y0,p.z0,ar);var sx=proj.sx,sy=proj.sy,sf=proj.sf;if(sx<-8||sx>W+8||sy<-8||sy>H+8)continue;ctx.globalAlpha=p.a*Math.min(1,sf*1.3);ctx.fillStyle='hsl('+p.h+','+p.s+'%,'+p.l+'%)';ctx.beginPath();ctx.arc(sx,sy,Math.max(.25,p.r*sf),0,PI2);ctx.fill();}ctx.globalAlpha=1;}

// HALO
function dibujarHalo(pulso){
  var r1=Math.min(W,H)*.115*pulso,r2=Math.min(W,H)*.30*pulso;
  var g=ctx.createRadialGradient(CX,CY,0,CX,CY,r1);g.addColorStop(0,'rgba(255,245,130,.98)');g.addColorStop(.3,'rgba(255,195,45,.70)');g.addColorStop(1,'rgba(255,110,0,0)');ctx.globalAlpha=1;ctx.fillStyle=g;ctx.beginPath();ctx.arc(CX,CY,r1,0,PI2);ctx.fill();
  g=ctx.createRadialGradient(CX,CY,r1*.15,CX,CY,r2);g.addColorStop(0,'rgba(255,195,50,.28)');g.addColorStop(1,'rgba(255,90,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(CX,CY,r2,0,PI2);ctx.fill();
}

// ESPIRALES
function dibujarEspirales(ar){
  var RM=radioMax();var BRAZOS=3;
  for(var b=0;b<BRAZOS;b++){
    var off=(b/BRAZOS)*PI2;
    ctx.lineWidth=1.2;ctx.beginPath();var first=true;
    for(var i=0;i<=200;i++){var frac=i/200;var r=5+frac*RM;var ang=frac*Math.PI*5+off;var proj=proyectar(Math.cos(ang)*r,0,Math.sin(ang)*r,ar);if(first){ctx.moveTo(proj.sx,proj.sy);}else{ctx.lineTo(proj.sx,proj.sy);}first=false;}
    ctx.strokeStyle='hsla('+(38+b*14)+',100%,65%,.22)';ctx.stroke();
    ctx.lineWidth=.5;ctx.beginPath();first=true;
    for(var i=0;i<=200;i++){var frac=i/200;var r=5+frac*RM;var ang=frac*Math.PI*5+off;var proj=proyectar(Math.cos(ang)*r,0,Math.sin(ang)*r,ar);if(first){ctx.moveTo(proj.sx,proj.sy);}else{ctx.lineTo(proj.sx,proj.sy);}first=false;}
    ctx.strokeStyle='hsla('+(55+b*10)+',100%,85%,.12)';ctx.stroke();
  }
}

// ANILLOS
function dibujarAnillos(ar){
  var RM=radioMax();var fracs=[.28,.52,.78];var cols=['rgba(255,215,45,.13)','rgba(255,155,15,.11)','rgba(255,90,0,.09)'];
  for(var fi=0;fi<fracs.length;fi++){var r=RM*fracs[fi];ctx.beginPath();for(var j=0;j<=110;j++){var ang=(j/110)*PI2;var proj=proyectar(Math.cos(ang)*r,0,Math.sin(ang)*r,ar);if(j===0){ctx.moveTo(proj.sx,proj.sy);}else{ctx.lineTo(proj.sx,proj.sy);}}ctx.strokeStyle=cols[fi];ctx.lineWidth=1;ctx.stroke();}
}

// ESTRELLAS DORADAS
var ESTRELLAS=[];
function crearEstrellas(){ESTRELLAS=[];var RM=radioMax();for(var i=0;i<60;i++){var r=rnd(RM*.08,RM*.94);ESTRELLAS.push({r:r,ang:rnd(0,PI2),velAng:rnd(.003,.011)*(Math.random()>.5?1:-1),ampY:rnd(.008,.042)*RM,velY:rnd(.35,1.3),faseY:rnd(0,PI2),sz:rnd(2.2,7),faseBr:rnd(0,PI2),velBr:rnd(.7,2.6)});}}
function estrella5(cx,cy,r1,r2,rot){ctx.beginPath();for(var i=0;i<10;i++){var a=rot+(i/10)*PI2-Math.PI/2;var rr=i%2===0?r1:r2;if(i===0){ctx.moveTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);}else{ctx.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);}}ctx.closePath();}
function dibujarEstrellas(ar){
  for(var i=0;i<ESTRELLAS.length;i++){var s=ESTRELLAS[i];s.ang+=s.velAng;var proj=proyectar(Math.cos(s.ang)*s.r,Math.sin(t*s.velY+s.faseY)*s.ampY,Math.sin(s.ang)*s.r,ar);var sx=proj.sx,sy=proj.sy,sf=proj.sf;var br=.5+.5*Math.sin(t*s.velBr+s.faseBr);var sz=s.sz*sf*(0.75+.35*br);if(sz<.4)continue;
    ctx.globalAlpha=br*.52;ctx.strokeStyle='#fffde0';ctx.lineWidth=sz*.13;ctx.beginPath();ctx.moveTo(sx-sz*2.8,sy);ctx.lineTo(sx+sz*2.8,sy);ctx.stroke();ctx.beginPath();ctx.moveTo(sx,sy-sz*2.8);ctx.lineTo(sx,sy+sz*2.8);ctx.stroke();

(function(){CF.forEach(function(cf){var sz=96,oc=document.createElement('canvas');oc.width=oc.height=sz;var c=oc.getContext('2d'),cx=sz/2,cy=sz/2,pr=sz*.36,cr=sz*.145;c.save();c.shadowColor='rgba(80,20,0,.35)';c.shadowBlur=6;c.shadowOffsetY=4;for(var capa=0;capa<2;capa++){for(var i=0;i<8;i++){var ang=(i/8)*PI2+(capa?Math.PI/8:0);var px=cx+Math.cos(ang)*pr*.52,py=cy+Math.sin(ang)*pr*.52;var gp=c.createRadialGradient(px,py,0,px,py,pr*.82);gp.addColorStop(0,capa?cf.p1:cf.p2);gp.addColorStop(.55,capa?cf.p2:cf.p3);gp.addColorStop(1,'rgba(0,0,0,0)');c.globalAlpha=capa?.92:.58;c.fillStyle=gp;c.beginPath();c.ellipse(px,py,pr*.44,pr*.74,ang+Math.PI/2,0,PI2);c.fill();}}c.restore();c.globalAlpha=1;var gc=c.createRadialGradient(cx-cr*.25,cy-cr*.25,0,cx,cy,cr);gc.addColorStop(0,'#B06030');gc.addColorStop(.45,cf.c);gc.addColorStop(1,'#1e0800');c.fillStyle=gc;c.beginPath();c.arc(cx,cy,cr,0,PI2);c.fill();c.fillStyle='rgba(30,8,0,.5)';for(var i=0;i<8;i++){var a=(i/8)*PI2,rr=cr*.65;c.beginPath();c.arc(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr,cr*.16,0,PI2);c.fill();}c.beginPath();c.arc(cx,cy,cr*.18,0,PI2);c.fill();c.fillStyle='rgba(255,255,200,.28)';c.beginPath();c.arc(cx-cr*.4,cy-cr*.5,cr*.7,0,PI2);c.fill();FLOR_IMGS.push(oc);});})();

var FLORES=[];
function crearFlores(){
  FLORES=[];var RM=radioMax();
  var grupos=[{count:5,rMin:RM*.12,rMax:RM*.30,szBase:28},{count:6,rMin:RM*.40,rMax:RM*.62,szBase:38},{count:5,rMin:RM*.70,rMax:RM*.95,szBase:50}];
  var gi=0;
  grupos.forEach(function(g){for(var i=0;i<g.count;i++){var r=rnd(g.rMin,g.rMax);var ang=(gi/16)*PI2+rnd(0,.5);var velAng=(rnd(.004,.009)/(r/RM+.3))*(Math.random()>.5?1:-1);FLORES.push({r:r,ang:ang,velAng:velAng,ampY:rnd(.04,.10)*RM,velY:rnd(.25,.75),faseY:rnd(0,PI2),rotAng:rnd(0,PI2),rotVel:rnd(-.018,.018),szBase:g.szBase+rnd(-6,6),img:FLOR_IMGS[gi%FLOR_IMGS.length],fasePulso:rnd(0,PI2)});gi++;}});
}
function dibujarFlores(ar){
  var conZ=FLORES.map(function(f){f.ang+=f.velAng;f.rotAng+=f.rotVel;var wx=Math.cos(f.ang)*f.r,wy=Math.sin(t*f.velY+f.faseY)*f.ampY,wz=Math.sin(f.ang)*f.r;var proj=proyectar(wx,wy,wz,ar);return{f:f,sx:proj.sx,sy:proj.sy,sf:proj.sf};});
  conZ.sort(function(a,b){return a.sf-b.sf;});
  conZ.forEach(function(item){var f=item.f,sx=item.sx,sy=item.sy,sf=item.sf;var pulso=1+Math.sin(t*1.1+f.fasePulso)*.1;var s=f.szBase*sf*pulso;if(s<4)return;var alpha=Math.min(1,sf*1.9)*.94;if(alpha<.05)return;ctx.save();ctx.translate(sx,sy);ctx.rotate(f.rotAng);ctx.globalAlpha=alpha;ctx.shadowColor='rgba(200,100,0,.35)';ctx.shadowBlur=s*.3;ctx.shadowOffsetX=s*.08;ctx.shadowOffsetY=s*.12;ctx.drawImage(f.img,-s/2,-s/2,s,s);ctx.restore();});
  ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
}

// LOOP
function loop(){
  requestAnimationFrame(loop);
  if(!activa)return;
  t+=.011;
  angRot+=0.018;
  ctx.fillStyle='rgba(0,0,0,.52)';ctx.fillRect(0,0,W,H);
  dibujarFondo();dibujarAnillos(angRot);dibujarEspirales(angRot);
  dibujarGalaxia(angRot);dibujarEstrellas(angRot);dibujarFlores(angRot);
  dibujarHalo(1+Math.sin(t*1.5)*.07);
  actualizarViz();
}

// MUSICA
var audio=document.getElementById('audioFlor');
var musicaActiva=false;
var analyser=null,analyserData=null,audioCtx2=null,sourceNode=null;

function conectarAnalyser(){
  if(audioCtx2)return;
  try{audioCtx2=new(window.AudioContext||window.webkitAudioContext)();sourceNode=audioCtx2.createMediaElementSource(audio);analyser=audioCtx2.createAnalyser();analyser.fftSize=128;analyserData=new Uint8Array(analyser.frequencyBinCount);sourceNode.connect(analyser);analyser.connect(audioCtx2.destination);}catch(e){}
}

function iniciarMusica(){
  conectarAnalyser();
  if(audioCtx2&&audioCtx2.state==='suspended')audioCtx2.resume();
  audio.volume=0;
  audio.play().then(function(){
    musicaActiva=true;
    var v=0;var fi=setInterval(function(){v=Math.min(1,v+0.04);audio.volume=v;if(v>=1)clearInterval(fi);},80);
    document.getElementById('btnMusica').textContent='&#128263; Silenciar';
  }).catch(function(){document.getElementById('notaMusica').style.display='block';});
}

function detenerMusica(){
  musicaActiva=false;
  var v=audio.volume;
  var fo=setInterval(function(){v=Math.max(0,v-0.05);audio.volume=v;if(v<=0){clearInterval(fo);audio.pause();audio.currentTime=0;}},80);
  document.getElementById('btnMusica').textContent='&#127925; Musica';
}

document.getElementById('btnActivarMusica').addEventListener('click',function(){
  document.getElementById('notaMusica').style.display='none';
  conectarAnalyser();if(audioCtx2&&audioCtx2.state==='suspended')audioCtx2.resume();
  audio.volume=1;audio.play();musicaActiva=true;
  document.getElementById('btnMusica').textContent='&#128263; Silenciar';
});

// VISUALIZADOR
var vizCvs=document.getElementById('vizCanvas');
var vizCtx=vizCvs.getContext('2d');
function resizeViz(){vizCvs.width=window.innerWidth;vizCvs.height=60;}
resizeViz();window.addEventListener('resize',resizeViz);
function actualizarViz(){
  if(!analyser||!musicaActiva)return;
  analyser.getByteFrequencyData(analyserData);
  vizCtx.clearRect(0,0,vizCvs.width,60);
  var bw=vizCvs.width/analyserData.length*2.5;
  for(var i=0;i<analyserData.length;i++){var v=analyserData[i]/255,bh=v*48,x=i*bw;var g=vizCtx.createLinearGradient(x,60-bh,x,60);g.addColorStop(0,'rgba(255,230,0,.8)');g.addColorStop(1,'rgba(255,100,0,.3)');vizCtx.fillStyle=g;vizCtx.fillRect(x,60-bh,bw*.8,bh);}
}

var tarjetaIdx=0,tarjetaTimer=null,tarjetaAbierta=false;
var overlayT=document.getElementById('overlay-tarjeta');
var tSvg=document.getElementById('tarjeta-svg-wrap');
var tTit=document.getElementById('tarjeta-titulo');
var tMsg=document.getElementById('tarjeta-msg');
var tCerrar=document.getElementById('tarjeta-cerrar');

function mostrarTarjeta(){
  if(tarjetaAbierta)return;
  var card=TARJETAS[tarjetaIdx%TARJETAS.length];
  tSvg.innerHTML=card.svg;
  tTit.textContent=card.titulo;
  tMsg.innerHTML=card.msg;
  tarjetaIdx++;
  tarjetaAbierta=true;
  overlayT.classList.add('vis');
}

function cerrarTarjeta(){
  tarjetaAbierta=false;
  overlayT.classList.remove('vis');
  clearTimeout(tarjetaTimer);
  tarjetaTimer=setTimeout(mostrarTarjeta,5000);
}

function iniciarTarjetas(){
  clearTimeout(tarjetaTimer);
  tarjetaIdx=0;tarjetaAbierta=false;
  overlayT.classList.remove('vis');
  tarjetaTimer=setTimeout(mostrarTarjeta,5000);
}

function detenerTarjetas(){
  clearTimeout(tarjetaTimer);
  tarjetaAbierta=false;
  overlayT.classList.remove('vis');
}

tCerrar.addEventListener('click',cerrarTarjeta,{passive:true});
tCerrar.addEventListener('touchend',function(e){e.preventDefault();cerrarTarjeta();},{passive:false});
overlayT.addEventListener('click',function(e){if(e.target===overlayT)cerrarTarjeta();},{passive:true});
overlayT.addEventListener('touchend',function(e){if(e.target===overlayT){e.preventDefault();cerrarTarjeta();}},{passive:false});

// INTERACCION
var entrada=document.getElementById('entrada');
var ui=document.getElementById('ui');
var controles=document.getElementById('controles');
var btnMusica=document.getElementById('btnMusica');
var vizEl=document.getElementById('vizCanvas');

function abrirGalaxia(){
  activa=true;
  cvs.classList.add('vis');
  vizEl.classList.add('vis');
  setTimeout(function(){entrada.classList.add('ocultar');},50);
  setTimeout(function(){
    entrada.style.display='none';
    ui.classList.add('vis');
    controles.classList.add('vis');
    iniciarMusica();
    iniciarTarjetas();
  },1900);
}

function volverEntrada(){
  activa=false;
  detenerMusica();
  detenerTarjetas();
  document.getElementById('notaMusica').style.display='none';
  entrada.style.display='';
  setTimeout(function(){entrada.classList.remove('ocultar');},20);
  cvs.classList.remove('vis');
  vizEl.classList.remove('vis');
  ui.classList.remove('vis');
  controles.classList.remove('vis');
  ctx.clearRect(0,0,W,H);
  angRot=0;t=0;
}

btnMusica.addEventListener('click',function(){
  if(musicaActiva){detenerMusica();}else{iniciarMusica();}
});
btnMusica.addEventListener('touchend',function(e){e.preventDefault();btnMusica.click();},{passive:false});

function bindBtn(el,fn){
  el.addEventListener('click',fn,{passive:true});
  el.addEventListener('touchend',function(e){e.preventDefault();fn();},{passive:false});
}
bindBtn(document.getElementById('florBtn'),abrirGalaxia);
bindBtn(document.getElementById('btnVolver'),volverEntrada);
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
