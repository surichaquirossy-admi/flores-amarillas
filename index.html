<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <title>Día de las Flores Amarillas 🌻</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:Georgia,serif;touch-action:none;}

    #entrada{
      position:fixed;inset:0;
      background:radial-gradient(ellipse at 50% 60%,#1e0900 0%,#0a0400 55%,#000 100%);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      z-index:20;transition:opacity 1.4s ease,transform 1.4s ease;
    }
    #entrada.ocultar{opacity:0;transform:scale(1.25);pointer-events:none;}

    .rings{position:relative;display:flex;align-items:center;justify-content:center;width:220px;height:220px;}
    .ring{position:absolute;border-radius:50%;border:2px solid rgba(255,200,0,.6);animation:ring 2.6s ease-out infinite;}
    .ring:nth-child(1){width:130px;height:130px;animation-delay:0s;}
    .ring:nth-child(2){width:170px;height:170px;animation-delay:.7s;}
    .ring:nth-child(3){width:210px;height:210px;animation-delay:1.4s;}
    @keyframes ring{0%{transform:scale(.5);opacity:.9;}100%{transform:scale(1.1);opacity:0;}}

    #florBtn{
      position:relative;z-index:2;cursor:pointer;
      animation:idle 3.5s ease-in-out infinite;
      filter:drop-shadow(0 0 18px #ffaa00) drop-shadow(0 0 40px #ff6600);
      -webkit-filter:drop-shadow(0 0 18px #ffaa00) drop-shadow(0 0 40px #ff6600);
      transition:transform .15s;
    }
    #florBtn:active{transform:scale(.9);}
    @keyframes idle{0%,100%{transform:scale(1) rotate(0deg);}30%{transform:scale(1.08) rotate(7deg);}70%{transform:scale(1.05) rotate(-5deg);}}

    .hint{margin-top:22px;color:#ffd54f;font-size:1rem;letter-spacing:3px;text-transform:uppercase;text-shadow:0 0 10px #ffaa00;animation:blink 2s ease-in-out infinite;}
    @keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}
    .subtitulo-entrada{margin-top:10px;color:rgba(255,245,200,.6);font-size:.82rem;letter-spacing:4px;text-transform:uppercase;text-align:center;padding:0 20px;}

    #cvs{position:fixed;inset:0;display:block;opacity:0;transition:opacity 1.8s ease .3s;}
    #cvs.vis{opacity:1;}

    #ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:clamp(20px,6vw,44px);pointer-events:none;z-index:10;opacity:0;transition:opacity 1.8s ease 1s;}
    #ui.vis{opacity:1;}

    .ttl{
      font-size:clamp(1.4rem,5.5vw,2.8rem);font-weight:bold;text-transform:uppercase;
      letter-spacing:3px;text-align:center;line-height:1.25;
      background:linear-gradient(90deg,#ffee00,#ffcc00,#ff9900,#ffee00);
      background-size:300%;
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      animation:gradmove 3s linear infinite;
      filter:drop-shadow(0 0 8px #ffcc00);-webkit-filter:drop-shadow(0 0 8px #ffcc00);
    }
    @keyframes gradmove{0%{background-position:0%}100%{background-position:300%}}
    .sub{margin-top:8px;color:rgba(255,245,200,.65);font-size:clamp(.75rem,2vw,.95rem);letter-spacing:5px;text-transform:uppercase;text-align:center;}

    #volver{
      position:fixed;bottom:clamp(16px,4vw,28px);left:50%;transform:translateX(-50%);
      z-index:15;background:rgba(255,200,0,.1);border:1px solid rgba(255,200,0,.45);
      color:#ffd54f;padding:10px 28px;border-radius:40px;font-size:.85rem;
      letter-spacing:2px;text-transform:uppercase;cursor:pointer;pointer-events:all;
      opacity:0;transition:opacity 1.8s ease 1.5s,background .3s;
      backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    }
    #volver:active{background:rgba(255,200,0,.3);}
    #volver.vis{opacity:1;}
  </style>
</head>
<body>

<div id="entrada">
  <div class="rings">
    <div class="ring"></div><div class="ring"></div><div class="ring"></div>
    <svg id="florBtn" width="120" height="120" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="button" aria-label="Abrir galaxia">
      <defs>
        <radialGradient id="gP" cx="50%" cy="20%" r="80%">
          <stop offset="0%" stop-color="#FFE234"/><stop offset="50%" stop-color="#FFC200"/><stop offset="100%" stop-color="#E68A00"/>
        </radialGradient>
        <radialGradient id="gC" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#8B4513"/><stop offset="60%" stop-color="#5D2E00"/><stop offset="100%" stop-color="#3B1A00"/>
        </radialGradient>
        <filter id="fw"><feGaussianBlur stdDeviation="2.5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g transform="translate(100,100)" filter="url(#fw)">
        <ellipse cx="0" cy="-54" rx="17" ry="36" fill="url(#gP)" opacity=".72" transform="rotate(0)"/>
        <ellipse cx="0" cy="-54" rx="17" ry="36" fill="url(#gP)" opacity=".72" transform="rotate(45)"/>
        <ellipse cx="0" cy="-54" rx="17" ry="36" fill="url(#gP)" opacity=".72" transform="rotate(90)"/>
        <ellipse cx="0" cy="-54" rx="17" ry="36" fill="url(#gP)" opacity=".72" transform="rotate(135)"/>
        <ellipse cx="0" cy="-54" rx="17" ry="36" fill="url(#gP)" opacity=".72" transform="rotate(180)"/>
        <ellipse cx="0" cy="-54" rx="17" ry="36" fill="url(#gP)" opacity=".72" transform="rotate(225)"/>
        <ellipse cx="0" cy="-54" rx="17" ry="36" fill="url(#gP)" opacity=".72" transform="rotate(270)"/>
        <ellipse cx="0" cy="-54" rx="17" ry="36" fill="url(#gP)" opacity=".72" transform="rotate(315)"/>
      </g>
      <g transform="translate(100,100)" filter="url(#fw)">
        <ellipse cx="0" cy="-58" rx="15" ry="38" fill="url(#gP)" transform="rotate(22.5)"/>
        <ellipse cx="0" cy="-58" rx="15" ry="38" fill="url(#gP)" transform="rotate(67.5)"/>
        <ellipse cx="0" cy="-58" rx="15" ry="38" fill="url(#gP)" transform="rotate(112.5)"/>
        <ellipse cx="0" cy="-58" rx="15" ry="38" fill="url(#gP)" transform="rotate(157.5)"/>
        <ellipse cx="0" cy="-58" rx="15" ry="38" fill="url(#gP)" transform="rotate(202.5)"/>
        <ellipse cx="0" cy="-58" rx="15" ry="38" fill="url(#gP)" transform="rotate(247.5)"/>
        <ellipse cx="0" cy="-58" rx="15" ry="38" fill="url(#gP)" transform="rotate(292.5)"/>
        <ellipse cx="0" cy="-58" rx="15" ry="38" fill="url(#gP)" transform="rotate(337.5)"/>
      </g>
      <circle cx="100" cy="100" r="27" fill="url(#gC)" filter="url(#fw)"/>
      <circle cx="100" cy="100" r="21" fill="none" stroke="#7B3F00" stroke-width="1.5" stroke-dasharray="3 2"/>
      <circle cx="93" cy="93" r="7" fill="rgba(255,210,80,.35)"/>
    </svg>
  </div>
  <p class="hint">✨ Toca la flor ✨</p>
  <p class="subtitulo-entrada">Día de las Flores Amarillas</p>
</div>

<canvas id="cvs"></canvas>

<div id="ui">
  <h1 class="ttl">Día de las<br>Flores Amarillas</h1>
  <p class="sub">✦ &nbsp;21 de Septiembre&nbsp; ✦</p>
</div>
<button id="volver">← Volver</button>

<script>
const PI2=Math.PI*2;
const rnd=(a,b)=>Math.random()*(b-a)+a;

const cvs=document.getElementById('cvs');
const ctx=cvs.getContext('2d');
let W,H,CX,CY;
function resize(){W=window.innerWidth;H=window.innerHeight;CX=W/2;CY=H/2;cvs.width=W;cvs.height=H;}
resize();
window.addEventListener('resize',()=>{resize();construirGalaxia();crearEstrellas();crearFlores();});

let t=0,activa=false,angRot=0;

// FONDO ESTELAR
const FONDO=[];
function crearFondo(){FONDO.length=0;for(let i=0;i<220;i++)FONDO.push({x:rnd(0,1),y:rnd(0,1),r:rnd(.4,1.6),br:rnd(.3,1),vel:rnd(.3,1.2),fase:rnd(0,PI2)});}
function dibujarFondo(){for(const s of FONDO){ctx.globalAlpha=s.br*(.5+.5*Math.sin(t*s.vel+s.fase));ctx.fillStyle='#fff9e0';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,PI2);ctx.fill();}ctx.globalAlpha=1;}

// GALAXIA ESPIRAL 3D
const PART=[];const BRAZOS=3;const POR_BRAZO=700;
const INCL=0.52;
function radioMax(){return Math.min(W,H)*0.42;}
function construirGalaxia(){
  PART.length=0;const RM=radioMax();
  for(let b=0;b<BRAZOS;b++){const off=(b/BRAZOS)*PI2;for(let i=0;i<POR_BRAZO;i++){const frac=i/POR_BRAZO;const r=4+frac*RM;const ang=frac*Math.PI*5+off;PART.push({x0:Math.cos(ang)*r+rnd(-1,1)*r*.22,y0:rnd(-1,1)*(1-frac)*RM*.08,z0:Math.sin(ang)*r+rnd(-1,1)*r*.22,r:(1-frac)*2.4+rnd(.2,1.2),h:rnd(30,52),s:rnd(70,100),l:rnd(55,90),a:rnd(.4,.9),frac});}}
  for(let i=0;i<400;i++){const r=rnd(0,radioMax());const ang=rnd(0,PI2);PART.push({x0:Math.cos(ang)*r,y0:rnd(-1,1)*RM*.04,z0:Math.sin(ang)*r,r:rnd(.3,1),h:rnd(35,55),s:rnd(60,90),l:rnd(60,85),a:rnd(.15,.4),frac:r/radioMax()});}
}
function proyectar(x0,y0,z0,ar){
  const xr=x0*Math.cos(ar)+z0*Math.sin(ar);const zr=-x0*Math.sin(ar)+z0*Math.cos(ar);
  const yr=y0*Math.cos(INCL)-zr*Math.sin(INCL);const zf=y0*Math.sin(INCL)+zr*Math.cos(INCL);
  const fov=600;const dist=fov+zf*.25;
  return{sx:CX+(xr*fov)/dist,sy:CY+(yr*fov)/dist,sf:fov/dist};
}
function dibujarGalaxia(ar){for(const p of PART){const{sx,sy,sf}=proyectar(p.x0,p.y0,p.z0,ar);if(sx<-10||sx>W+10||sy<-10||sy>H+10)continue;ctx.globalAlpha=p.a*Math.min(1,sf*1.4);ctx.fillStyle=`hsl(${p.h},${p.s}%,${p.l}%)`;ctx.beginPath();ctx.arc(sx,sy,Math.max(.3,p.r*sf),0,PI2);ctx.fill();}ctx.globalAlpha=1;}

// HALO
function dibujarHalo(pulso){
  const r1=Math.min(W,H)*.12*pulso;const r2=Math.min(W,H)*.28*pulso;
  let g=ctx.createRadialGradient(CX,CY,0,CX,CY,r1);g.addColorStop(0,'rgba(255,240,120,0.95)');g.addColorStop(.35,'rgba(255,190,40,0.65)');g.addColorStop(1,'rgba(255,120,0,0)');ctx.globalAlpha=1;ctx.fillStyle=g;ctx.beginPath();ctx.arc(CX,CY,r1,0,PI2);ctx.fill();
  g=ctx.createRadialGradient(CX,CY,r1*.2,CX,CY,r2);g.addColorStop(0,'rgba(255,200,50,0.3)');g.addColorStop(1,'rgba(255,100,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(CX,CY,r2,0,PI2);ctx.fill();
}

// ESTRELLAS DORADAS
const ESTRELLAS=[];
function crearEstrellas(){ESTRELLAS.length=0;const RM=radioMax();for(let i=0;i<55;i++){const r=rnd(RM*.1,RM*.92);ESTRELLAS.push({r,ang:rnd(0,PI2),velAng:rnd(.004,.012)*(Math.random()>.5?1:-1),ampY:rnd(.01,.04)*RM,velY:rnd(.4,1.2),faseY:rnd(0,PI2),sz:rnd(2.5,6.5),faseBr:rnd(0,PI2),velBr:rnd(.8,2.5)});}}
function estrella5(cx,cy,r1,r2,rot){ctx.beginPath();for(let i=0;i<10;i++){const a=rot+(i/10)*PI2-Math.PI/2;const rr=i%2===0?r1:r2;i===0?ctx.moveTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr):ctx.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr);}ctx.closePath();}
function dibujarEstrellas(ar){
  for(const s of ESTRELLAS){s.ang+=s.velAng;const{sx,sy,sf}=proyectar(Math.cos(s.ang)*s.r,Math.sin(t*s.velY+s.faseY)*s.ampY,Math.sin(s.ang)*s.r,ar);const br=.5+.5*Math.sin(t*s.velBr+s.faseBr);const sz=s.sz*sf*(0.8+.3*br);if(sz<.5)continue;
    ctx.globalAlpha=br*.55;ctx.strokeStyle='#fffde0';ctx.lineWidth=sz*.15;ctx.beginPath();ctx.moveTo(sx-sz*2.5,sy);ctx.lineTo(sx+sz*2.5,sy);ctx.stroke();ctx.beginPath();ctx.moveTo(sx,sy-sz*2.5);ctx.lineTo(sx,sy+sz*2.5);ctx.stroke();
    ctx.globalAlpha=.7+.3*br;const gS=ctx.createRadialGradient(sx,sy,0,sx,sy,sz*1.4);gS.addColorStop(0,'rgba(255,255,200,1)');gS.addColorStop(.5,'rgba(255,210,50,.8)');gS.addColorStop(1,'rgba(255,140,0,0)');ctx.fillStyle=gS;estrella5(sx,sy,sz*1.4,sz*.55,t*.4);ctx.fill();}
  ctx.globalAlpha=1;
}

// FLORES ORBITANDO
const FLORES=[];
const CF=[{p1:'#FFE234',p2:'#FFC200',c:'#5D2E00'},{p1:'#FFEF60',p2:'#FFB300',c:'#4a1f00'},{p1:'#FFF176',p2:'#FFAA00',c:'#7B3F00'},{p1:'#FFD700',p2:'#E68A00',c:'#3B1A00'},{p1:'#FFCC02',p2:'#FF8C00',c:'#5D4000'}];
const FLOR_IMGS=[];
(function(){CF.forEach(cf=>{const sz=80;const oc=document.createElement('canvas');oc.width=oc.height=sz;const c=oc.getContext('2d');const cx=sz/2,cy=sz/2,pr=sz*.34,cr=sz*.14;for(let capa=0;capa<2;capa++){for(let i=0;i<8;i++){const ang=(i/8)*PI2+(capa?Math.PI/8:0);const px=cx+Math.cos(ang)*pr*.55;const py=cy+Math.sin(ang)*pr*.55;const gp=c.createRadialGradient(px,py,0,px,py,pr*.78);gp.addColorStop(0,capa?cf.p1:cf.p2);gp.addColorStop(1,'rgba(0,0,0,0)');c.globalAlpha=capa?1:.65;c.fillStyle=gp;c.beginPath();c.ellipse(px,py,pr*.42,pr*.72,ang+Math.PI/2,0,PI2);c.fill();}}c.globalAlpha=1;const gc=c.createRadialGradient(cx,cy,0,cx,cy,cr);gc.addColorStop(0,'#9B5523');gc.addColorStop(.5,cf.c);gc.addColorStop(1,'#2a0f00');c.fillStyle=gc;c.beginPath();c.arc(cx,cy,cr,0,PI2);c.fill();c.fillStyle='rgba(255,240,150,.35)';c.beginPath();c.arc(cx-cr*.3,cy-cr*.3,cr*.55,0,PI2);c.fill();FLOR_IMGS.push(oc);});})();
function crearFlores(){FLORES.length=0;const RM=radioMax();for(let i=0;i<16;i++){const r=rnd(RM*.12,RM*.9);FLORES.push({r,ang:(i/16)*PI2+rnd(0,.4),velAng:rnd(.003,.009)*(Math.random()>.5?1:-1),ampY:rnd(.01,.05)*RM,velY:rnd(.3,.9),faseY:rnd(0,PI2),rotAng:rnd(0,PI2),rotVel:rnd(-.015,.015),szBase:rnd(18,36),img:FLOR_IMGS[i%FLOR_IMGS.length]});}}
function dibujarFlores(ar){for(const f of FLORES){f.ang+=f.velAng;f.rotAng+=f.rotVel;const{sx,sy,sf}=proyectar(Math.cos(f.ang)*f.r,Math.sin(t*f.velY+f.faseY)*f.ampY,Math.sin(f.ang)*f.r,ar);const s=f.szBase*sf*(1+Math.sin(t*1.2+f.faseY)*.08);if(s<3)continue;ctx.save();ctx.translate(sx,sy);ctx.rotate(f.rotAng);ctx.globalAlpha=Math.min(1,sf*1.8)*.92;ctx.drawImage(f.img,-s/2,-s/2,s,s);ctx.restore();}ctx.globalAlpha=1;}

// ESPIRALES Y ANILLOS
function dibujarEspirales(ar){const RM=radioMax();ctx.lineWidth=1;for(let b=0;b<BRAZOS;b++){const off=(b/BRAZOS)*PI2;ctx.beginPath();let first=true;for(let i=0;i<=180;i++){const frac=i/180;const r=3+frac*RM;const ang=frac*Math.PI*5+off;const{sx,sy}=proyectar(Math.cos(ang)*r,0,Math.sin(ang)*r,ar);first?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);first=false;}ctx.strokeStyle=`hsla(${30+b*12},100%,65%,0.18)`;ctx.stroke();}}
function dibujarAnillos(ar){const RM=radioMax();[.3,.55,.82].forEach((frac,i)=>{const r=RM*frac;ctx.beginPath();for(let j=0;j<=120;j++){const ang=(j/120)*PI2;const{sx,sy}=proyectar(Math.cos(ang)*r,0,Math.sin(ang)*r,ar);j===0?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);}ctx.strokeStyle=['rgba(255,220,50,0.1)','rgba(255,160,20,0.1)','rgba(255,100,0,0.1)'][i];ctx.lineWidth=1;ctx.stroke();});}

// LOOP
function loop(){requestAnimationFrame(loop);if(!activa)return;t+=.012;angRot+=.007;ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,0,W,H);dibujarFondo();dibujarAnillos(angRot);dibujarEspirales(angRot);dibujarGalaxia(angRot);dibujarEstrellas(angRot);dibujarFlores(angRot);dibujarHalo(1+Math.sin(t*1.4)*.07);}

crearFondo();construirGalaxia();crearEstrellas();crearFlores();loop();

// INTERACCIÓN
const entrada=document.getElementById('entrada');
const ui=document.getElementById('ui');
const btnVolver=document.getElementById('volver');

function abrirGalaxia(){activa=true;cvs.classList.add('vis');setTimeout(()=>entrada.classList.add('ocultar'),60);setTimeout(()=>{entrada.style.display='none';ui.classList.add('vis');btnVolver.classList.add('vis');},1800);}
function volverEntrada(){activa=false;entrada.style.display='';setTimeout(()=>entrada.classList.remove('ocultar'),20);cvs.classList.remove('vis');ui.classList.remove('vis');btnVolver.classList.remove('vis');ctx.clearRect(0,0,W,H);angRot=0;t=0;}

function bindBtn(el,fn){el.addEventListener('click',fn,{passive:true});el.addEventListener('touchend',e=>{e.preventDefault();fn();},{passive:false});}
bindBtn(document.getElementById('florBtn'),abrirGalaxia);
bindBtn(btnVolver,volverEntrada);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
</script>
</body>
</html>
